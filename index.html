<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIPPS Performance Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        <!-- Header & User Status Area -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900">HIPPS Performance Tracker</h1>
                <p class="text-xs sm:text-sm text-slate-500">ระบบติดตามและประเมินผลการปฏิบัติงาน</p>
            </div>

            <div id="userStatusArea" class="flex items-center gap-2">
                <!-- Sync Status Badge -->
                <div id="cloudSyncBadge" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 transition-all">
                    <span id="cloudSyncDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="cloudSyncText">บันทึกข้อมูลอัตโนมัติ</span>
                </div>

                <!-- Login Button (Shown when logged out) -->
                <button id="googleLoginBtn" onclick="openGoogleLoginModal()" class="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow-sm transition-all">
                    เข้าสู่ระบบด้วย Google
                </button>
            </div>
        </header>

        <!-- Main Content Placeholder -->
        <main class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 min-h-[400px]">
            <p class="text-slate-600 text-center py-20">กำลังโหลดข้อมูลระบบ...</p>
        </main>
    </div>

    <!-- Script JS -->
    <script src="script.js"></script>
</body>
</html>
